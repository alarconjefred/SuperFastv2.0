server {
    listen __PORT__;
    listen [::]:__PORT__;
    server_name _;
    root /var/www/html/public;

    index index.php index.html;
    charset utf-8;

    # Registro de errores a stderr para visibilidad directa en Render
    error_log /dev/stderr warn;

    # Límite para subida de imágenes de productos (3MB configurado en Laravel)
    client_max_body_size 12M;
    client_body_temp_path /var/lib/nginx/tmp/client_body;

    # Encabezados de seguridad básicos
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Enrutamiento de URLs limpias de Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Caché para recursos estáticos y assets de Vite
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # Procesamiento de scripts PHP a través de PHP-FPM
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }

    # Bloqueo de acceso a archivos ocultos (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
